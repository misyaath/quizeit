x-judge0: &judge0
  image: judge0/judge0:1.13.1
  privileged: true
  environment:
    AUTHN_TOKEN: ${JUDGE0_TOKEN:?Set JUDGE0_TOKEN}
    POSTGRES_HOST: db
    POSTGRES_DB: judge0
    POSTGRES_USER: judge0
    POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?Set JUDGE0_POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?Set JUDGE0_REDIS_PASSWORD}
    JUDGE0_TELEMETRY_ENABLE: 'false'
    ENABLE_NETWORK: 'false'
    ALLOW_ENABLE_NETWORK: 'false'
    ENABLE_CALLBACKS: 'false'
    ENABLE_ADDITIONAL_FILES: 'false'
    ENABLE_COMPILER_OPTIONS: 'false'
    ENABLE_COMMAND_LINE_ARGUMENTS: 'false'
    COUNT: '2'
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  server:
    <<: *judge0
    ports:
      - '127.0.0.1:2358:2358'
    healthcheck:
      test: ['CMD', 'ruby', '-rnet/http', '-e', 'uri = URI("http://127.0.0.1:2358/languages"); req = Net::HTTP::Get.new(uri); req["X-Auth-Token"] = ENV.fetch("AUTHN_TOKEN"); abort unless Net::HTTP.start(uri.host, uri.port) { |http| http.request(req) }.is_a?(Net::HTTPSuccess)']
      interval: 5s
      timeout: 4s
      retries: 16
  workers:
    <<: *judge0
    command: ['./scripts/workers']
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?Set JUDGE0_POSTGRES_PASSWORD}
    volumes:
      - judge0-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'judge0', '-d', 'judge0']
      interval: 3s
      timeout: 2s
      retries: 15
  redis:
    image: redis:7.2
    environment:
      REDISCLI_AUTH: ${JUDGE0_REDIS_PASSWORD:?Set JUDGE0_REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDISCLI_AUTH"']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 15

volumes:
  judge0-db:
